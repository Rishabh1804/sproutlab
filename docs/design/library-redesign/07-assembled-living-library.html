<!DOCTYPE html>
<!--
  SproutLab · Diet → Library redesign — S7 ASSEMBLED LIVING LIBRARY · LIGHT + DARK (design record)
  ─────────────────────────────────────────────────────────────────────────
  The whole Browse-foods wing with the ratified living-book treatment:
    • wings control (Browse foods active) + pinned Emergency entry  [S1/S4]
    • 4 polarity shelves (encourage/conditional/warn/inform) — rail + --tc header
    • food-domain WHISPER pills (dt-*, #217/#218)                   [S4]
    • EP-bank epithet VOICE line (Fraunces italic, typography C)    [S6]
    • the JOURNEY channel — Receded chips, second channel:
        ① Invitation (untried, float up) → ② Settled (ok, sage ✓) →
        ③ Watching (watch, amber EYE → Info) → ④ Established
        (favourite + ok + ≥21d → form retires → recipe nudge + ★ a regular)
    • WARN-shelf books: no voice, no journey (a wait-food's voice is the rule).
  Channels never cross: NAME+VOICE · GLANCE(form) · JOURNEY(history) · RAIL+SIREN(safety).
  New icon: zi-eye (watching) — to be added to template.html sprite at wiring (109→110).
  EP gaps to fill at wiring: soy, citrus, plant-milk.
  Real styles.css tokens; verbatim FOOD_EFFECTS-derived copy + EP epithets.
-->
<html lang="en" data-zoom="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../split/styles.css">
<style>
  html, body { background:#cfc6bf; }
  body { margin:0; font-family:'Nunito',sans-serif; padding:24px; }
  .r-stage { display:flex; gap:28px; align-items:flex-start; justify-content:center; }
  .r-col { width:412px; flex:0 0 auto; }
  .r-mode { font-family:'Fraunces',serif; font-weight:600; font-size:18px; text-align:center; margin:0 0 10px; letter-spacing:0.04em; }
  .r-mode.light { color:#5a4f48; } .r-mode.dark { color:#2a2230; }
  .r-phone { width:412px; box-sizing:border-box; background:var(--bg, #faf6f3); color:var(--text);
    border-radius:22px; padding:var(--sp-16); box-shadow:0 6px 30px rgba(0,0,0,0.14); }
  .r-phone[data-theme="dark"] { background:#1a1620; box-shadow:0 6px 30px rgba(0,0,0,0.5); }
  .r-h { font-family:'Fraunces',serif; font-size:var(--fs-2xl); font-weight:600; color:var(--text); margin:0 0 var(--sp-4); }
  .r-sub { font-size:var(--fs-sm); color:var(--mid); margin:0 0 var(--sp-16); }

  /* wings control */
  .lib-wings { display:flex; gap:var(--sp-4); background:var(--surface-alt); border-radius:var(--r-2xl); padding:var(--sp-4); margin-bottom:var(--sp-16); }
  .lib-wing { flex:1; padding:var(--sp-10) var(--sp-8); min-height:36px; border:none; border-radius:var(--r-2xl); background:transparent; cursor:pointer;
    font-family:'Nunito',sans-serif; font-size:var(--fs-sm); font-weight:700; color:var(--mid); display:flex; align-items:center; justify-content:center; gap:var(--sp-6); white-space:nowrap; }
  .lib-wing--active { background:var(--card-bg); color:var(--tc-sage); box-shadow:0 2px 10px var(--shadow); }
  .lib-wing .zi { width:var(--icon-base); height:var(--icon-base); }

  /* emergency entry */
  .emerg-entry { display:flex; align-items:center; gap:var(--sp-12); width:100%; text-align:left;
    background:var(--rose-light); border-left:var(--accent-w, 3px) solid var(--rose); border-radius:var(--r-2xl);
    padding:var(--sp-16); min-height:44px; box-shadow:0 3px 14px var(--shadow); margin-bottom:var(--sp-20); }
  .emerg-entry-icon { flex:0 0 auto; width:40px; height:40px; border-radius:var(--r-full); background:var(--rose); color:var(--card-bg); display:flex; align-items:center; justify-content:center; }
  .emerg-entry-icon .zi { width:var(--icon-lg); height:var(--icon-lg); }
  .emerg-entry-txt { flex:1; min-width:0; }
  .emerg-entry-title { font-family:'Fraunces',serif; font-weight:600; font-size:var(--fs-lg); color:var(--tc-rose); line-height:var(--lh-snug); }
  .emerg-entry-sub { font-size:var(--fs-xs); color:var(--mid); margin-top:var(--sp-2); }
  .emerg-entry-go { flex:0 0 auto; color:var(--tc-rose); }
  .emerg-entry-go .zi { width:var(--icon-md); height:var(--icon-md); }

  /* group header */
  .lib-group { margin-bottom:var(--sp-16); }
  .lib-group-label { display:flex; align-items:center; gap:var(--sp-8); font-family:'Fraunces',serif; font-weight:600; font-size:var(--fs-md); line-height:var(--lh-snug); margin:var(--sp-12) 0 var(--sp-10); padding-left:var(--sp-4); }
  .lib-group-label .zi { width:var(--icon-md); height:var(--icon-md); flex:0 0 auto; }
  .lib-group-count { margin-left:auto; font-family:'Nunito',sans-serif; font-weight:700; font-size:var(--fs-2xs); opacity:0.7; }
  .lib-group--encourage   .lib-group-label { color:var(--tc-sage); }
  .lib-group--conditional .lib-group-label { color:var(--tc-amber); }
  .lib-group--warn        .lib-group-label { color:var(--tc-rose); }
  .lib-group--inform      .lib-group-label { color:var(--tc-sky); }
  .lib-shelf-row { display:flex; flex-direction:column; gap:var(--sp-10); }

  /* lib-book row */
  .lib-book { display:flex; align-items:center; gap:var(--sp-12); width:100%; text-align:left; border-radius:var(--r-lg);
    padding:var(--sp-12) var(--sp-16); min-height:44px; box-shadow:0 1px 8px var(--shadow);
    background-color:var(--card-bg); border:none; }
  .lib-book--encourage   { border-left:3px solid var(--sage); }
  .lib-book--conditional { border-left:3px solid var(--amber); }
  .lib-book--warn        { border-left:3px solid var(--rose); }
  .lib-book--inform      { border-left:3px solid var(--sky); }

  /* food-domain whisper — light */
  .dt-nonveg { background-image:linear-gradient(135deg, transparent 40%, rgba(242,168,184,0.22)); }
  .dt-nuts   { background-image:linear-gradient(135deg, transparent 40%, rgba(201,184,232,0.22)); }
  .dt-grains { background-image:linear-gradient(135deg, transparent 40%, rgba(181,213,197,0.22)); }
  .dt-spices { background-image:linear-gradient(135deg, transparent 40%, rgba(232,184,109,0.22)); }
  .dt-fruits { background-image:linear-gradient(135deg, transparent 40%, rgba(242,168,184,0.22)); }
  .dt-dairy  { background-image:linear-gradient(135deg, transparent 40%, rgba(168,207,224,0.22)); }
  /* food-domain whisper — dark (hue-swap) */
  [data-theme="dark"] .dt-nonveg { background-image:linear-gradient(135deg, transparent 30%, rgba(158,62,82,0.18)); }
  [data-theme="dark"] .dt-nuts   { background-image:linear-gradient(135deg, transparent 30%, rgba(110,94,154,0.18)); }
  [data-theme="dark"] .dt-grains { background-image:linear-gradient(135deg, transparent 30%, rgba(58,112,96,0.16)); }
  [data-theme="dark"] .dt-spices { background-image:linear-gradient(135deg, transparent 30%, rgba(138,101,32,0.18)); }
  [data-theme="dark"] .dt-fruits { background-image:linear-gradient(135deg, transparent 30%, rgba(158,62,82,0.18)); }
  [data-theme="dark"] .dt-dairy  { background-image:linear-gradient(135deg, transparent 30%, rgba(58,112,144,0.16)); }

  .lib-book-body { flex:1; min-width:0; }
  .lib-book-title { display:block; font-family:'Fraunces',serif; font-weight:600; font-size:var(--fs-md); color:var(--text); line-height:var(--lh-snug); }
  .lib-book-reg { font-weight:400; color:var(--tc-sage); font-size:var(--fs-sm); }
  .lib-book-voice { display:block; font-family:'Fraunces',serif; font-style:italic; font-weight:400; font-size:var(--fs-sm); color:var(--mid); line-height:var(--lh-snug); margin-top:1px; }
  .lib-book-glance { font-size:var(--fs-sm); color:var(--mid); margin-top:var(--sp-6); display:flex; align-items:center; gap:var(--sp-6); }
  .lib-book-glance .zi { width:var(--icon-sm); height:var(--icon-sm); flex:0 0 auto; color:var(--tc-amber); }
  .lib-book-siren { flex:0 0 auto; color:var(--rose); display:flex; align-items:center; align-self:flex-start; margin-top:var(--sp-2); }
  .lib-book-siren .zi { width:var(--icon-base); height:var(--icon-base); }
  .lib-book-go { flex:0 0 auto; color:var(--light); align-self:center; }
  .lib-book-go .zi { width:var(--icon-base); height:var(--icon-base); }

  /* journey channel */
  .lib-untried { display:inline-flex; align-items:center; gap:var(--sp-6); margin-top:var(--sp-8);
    font-family:'Nunito',sans-serif; font-weight:600; font-size:var(--fs-2xs); color:var(--light); }
  .lib-untried .dot { width:6px; height:6px; border-radius:var(--r-full); border:1.5px solid var(--light); }
  .lib-journey { display:inline-flex; align-items:center; gap:var(--sp-6); margin-top:var(--sp-8);
    padding:var(--sp-4) var(--sp-10); border-radius:var(--r-2xl); width:fit-content;
    font-family:'Nunito',sans-serif; font-weight:700; font-size:var(--fs-2xs); line-height:1; }
  .lib-journey .zi { width:var(--icon-sm); height:var(--icon-sm); flex:0 0 auto; }
  .lib-journey .zi-go { width:var(--icon-xs); height:var(--icon-xs); margin-left:var(--sp-2); opacity:0.8; }
  .lib-journey--settled { background:var(--sage-light); color:var(--tc-sage); }
  .lib-journey--watching { background:var(--amber-light); color:var(--tc-amber); }
  .lib-journey--regular { background:var(--sage-light); color:var(--tc-sage); }
  .lib-book-nudge { font-size:var(--fs-sm); color:var(--tc-sage); margin-top:var(--sp-6); display:flex; align-items:center; gap:var(--sp-6); font-weight:600; }
  .lib-book-nudge .zi { width:var(--icon-sm); height:var(--icon-sm); flex:0 0 auto; }
  .lib-book-nudge .zi-go { width:var(--icon-xs); height:var(--icon-xs); opacity:0.8; }
</style>
</head>

<div class="r-stage">

  <!-- ══════════════ LIGHT ══════════════ -->
  <div class="r-col">
    <p class="r-mode light">Light</p>
    <div class="r-phone">
      <h1 class="r-h">Food library</h1>
      <p class="r-sub">What Ziva's tried, when, and in what form.</p>
      <div class="lib-wings">
        <button class="lib-wing lib-wing--active"><svg class="zi"><use href="#zi-book"/></svg>Browse foods</button>
        <button class="lib-wing"><svg class="zi"><use href="#zi-shield"/></svg>Safety guides</button>
      </div>
      <button class="emerg-entry"><span class="emerg-entry-icon"><svg class="zi"><use href="#zi-siren"/></svg></span><span class="emerg-entry-txt"><span class="emerg-entry-title">In an emergency</span><span class="emerg-entry-sub">Choking · allergic reaction · delayed vomiting · poisoning</span></span><span class="emerg-entry-go"><svg class="zi"><use href="#zi-arrow-right"/></svg></span></button>

      <div class="lib-group lib-group--encourage">
        <div class="lib-group-label"><svg class="zi"><use href="#zi-sprout"/></svg>Introduce early<span class="lib-group-count">5</span></div>
        <div class="lib-shelf-row">
          <button class="lib-book lib-book--encourage dt-grains"><span class="lib-book-body"><span class="lib-book-title">Soy</span><span class="lib-book-voice">mild &amp; silky</span><span class="lib-book-glance"><svg class="zi"><use href="#zi-spoon"/></svg>Soft tofu — not whole edamame</span><span class="lib-untried"><span class="dot"></span>Not tried yet</span></span><span class="lib-book-siren"><svg class="zi"><use href="#zi-siren"/></svg></span><span class="lib-book-go"><svg class="zi"><use href="#zi-arrow-right"/></svg></span></button>
          <button class="lib-book lib-book--encourage dt-nuts"><span class="lib-book-body"><span class="lib-book-title">Sesame</span><span class="lib-book-voice">nutty &amp; toasty</span><span class="lib-book-glance"><svg class="zi"><use href="#zi-spoon"/></svg>Thinned tahini — not whole seeds</span><span class="lib-untried"><span class="dot"></span>Not tried yet</span></span><span class="lib-book-siren"><svg class="zi"><use href="#zi-siren"/></svg></span><span class="lib-book-go"><svg class="zi"><use href="#zi-arrow-right"/></svg></span></button>
          <button class="lib-book lib-book--encourage dt-nuts"><span class="lib-book-body"><span class="lib-book-title">Peanut</span><span class="lib-book-voice">nutty &amp; rich</span><span class="lib-book-glance"><svg class="zi"><use href="#zi-spoon"/></svg>Ground or smooth — never whole</span><span class="lib-journey lib-journey--settled"><svg class="zi"><use href="#zi-check"/></svg>Tried · agreed with her</span></span><span class="lib-book-siren"><svg class="zi"><use href="#zi-siren"/></svg></span><span class="lib-book-go"><svg class="zi"><use href="#zi-arrow-right"/></svg></span></button>
          <button class="lib-book lib-book--encourage dt-nonveg"><span class="lib-book-body"><span class="lib-book-title">Fish</span><span class="lib-book-voice">tender &amp; omega-rich</span><span class="lib-book-glance"><svg class="zi"><use href="#zi-spoon"/></svg>Low-mercury, deboned, well-cooked</span><span class="lib-journey lib-journey--watching"><svg class="zi"><use href="#zi-eye"/></svg>Tried · keeping an eye on it<svg class="zi zi-go"><use href="#zi-arrow-right"/></svg></span></span><span class="lib-book-siren"><svg class="zi"><use href="#zi-siren"/></svg></span><span class="lib-book-go"><svg class="zi"><use href="#zi-arrow-right"/></svg></span></button>
          <button class="lib-book lib-book--encourage dt-nonveg"><span class="lib-book-body"><span class="lib-book-title">Egg <span class="lib-book-reg">· a regular now</span></span><span class="lib-book-voice">soft &amp; protein-rich</span><span class="lib-book-nudge"><svg class="zi"><use href="#zi-bowl"/></svg>Try it in egg &amp; spinach khichdi<svg class="zi zi-go"><use href="#zi-arrow-right"/></svg></span><span class="lib-journey lib-journey--regular"><svg class="zi"><use href="#zi-star"/></svg>A regular for Ziva</span></span><span class="lib-book-siren"><svg class="zi"><use href="#zi-siren"/></svg></span><span class="lib-book-go"><svg class="zi"><use href="#zi-arrow-right"/></svg></span></button>
        </div>
      </div>

      <div class="lib-group lib-group--conditional">
        <div class="lib-group-label"><svg class="zi"><use href="#zi-clock"/></svg>Right time, right form<span class="lib-group-count">2</span></div>
        <div class="lib-shelf-row">
          <button class="lib-book lib-book--conditional dt-fruits"><span class="lib-book-body"><span class="lib-book-title">Citrus</span><span class="lib-book-voice">bright &amp; tangy</span><span class="lib-book-glance"><svg class="zi"><use href="#zi-spoon"/></svg>Soft segments, no seeds</span><span class="lib-untried"><span class="dot"></span>Not tried yet</span></span><span class="lib-book-go"><svg class="zi"><use href="#zi-arrow-right"/></svg></span></button>
          <button class="lib-book lib-book--conditional dt-dairy"><span class="lib-book-body"><span class="lib-book-title">Cow's milk</span><span class="lib-book-voice">creamy &amp; gentle</span><span class="lib-book-glance"><svg class="zi"><use href="#zi-spoon"/></svg>Fine in food; wait as a drink</span><span class="lib-journey lib-journey--settled"><svg class="zi"><use href="#zi-check"/></svg>Tried · agreed with her</span></span><span class="lib-book-siren"><svg class="zi"><use href="#zi-siren"/></svg></span><span class="lib-book-go"><svg class="zi"><use href="#zi-arrow-right"/></svg></span></button>
        </div>
      </div>

      <div class="lib-group lib-group--warn">
        <div class="lib-group-label"><svg class="zi"><use href="#zi-warn"/></svg>Wait — and here's why<span class="lib-group-count">2</span></div>

        </div>
      </div>

      <div class="lib-group lib-group--inform">
