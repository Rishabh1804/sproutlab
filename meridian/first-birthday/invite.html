:root {
  --ice-white: #f2f9ff;
  --ice-light: #d9ecfc;
  --ice-mid: #9cc8ef;
  --ice-deep: #6ea3d8;
  --night-1: #050f21;
  --night-2: #0a2140;
  --night-3: #10365c;
}

html, body {
  margin: 0;
  padding: 0;
  background: #04101f;
  height: 100%;
  overflow: hidden;
}

#stage {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  transform-origin: top left;
  background: linear-gradient(180deg, #8fc4e8 0%, #a9d4f0 26%, #c6e4f7 52%, #ddeffa 76%, #ecf7fd 100%);
}

canvas { position: absolute; left: 0; top: 0; }

#ui { position: absolute; inset: 0; }

.txt {
  position: absolute;
  left: 0;
  width: 100%;
  text-align: center;
  opacity: 0;
  will-change: transform, opacity, filter;
}

/* ---------- Intro ---------- */
#introL1, #introL2 {
  font-family: 'Great Vibes', cursive;
  color: #1d4066;
  text-shadow: 0 0 26px rgba(255, 255, 255, 0.95), 0 2px 10px rgba(120, 165, 210, 0.35);
}
#introL1 { top: 852px; font-size: 96px; }
#introL2 { top: 1000px; font-size: 118px; }
#introL2 b {
  font-weight: 400;
  background-image: linear-gradient(160deg, #e2bd6b 0%, #b8892e 45%, #edd28a 75%, #c99a3d 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ---------- Name block ---------- */
#name {
  top: 478px;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 272px;
  line-height: 1;
  letter-spacing: 0.045em;
  opacity: 1; /* letters carry their own opacity */
  filter: drop-shadow(0 0 26px rgba(255, 255, 255, 0.9)) drop-shadow(0 6px 22px rgba(110, 155, 205, 0.45));
}
#name span {
  display: inline-block;
  opacity: 0;
  will-change: transform, opacity, filter;
  background-image: linear-gradient(104deg,
      #1f4a78 0%, #2f6ba3 18%, #16375e 36%,
      #4e8cc0 52%, #1b4470 68%, #35709f 84%, #1f4a78 100%);
  background-size: 260% 100%;
  background-position: 0% 0;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 1px rgba(20, 50, 90, 0.25);
}

/* "IS TURNING ♛ 1" lockup */
#turns {
  top: 772px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 27px;
  letter-spacing: 0.5em;
  text-indent: 0.5em; /* re-center tracked caps */
  color: #2a5580;
  text-shadow: 0 0 14px rgba(255, 255, 255, 0.9);
}
#one {
  top: 812px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 112px;
  line-height: 1;
  background-image: linear-gradient(165deg, #e8c979 0%, #b8892e 40%, #f0d896 65%, #c1953a 100%);
  -webkit-background-clip: text;
  background-clip: text;

<script>
'use strict';
/* roundRect polyfill for older WebKit/Gecko so the live page never freezes */
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(Array.isArray(r) ? r[0] : r || 0, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
const W = 1080, H = 1920, DUR = 10.0;
const bg = document.getElementById('bg').getContext('2d');
const fg = document.getElementById('fg').getContext('2d');

/* ---------------- deterministic RNG ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------- easing ---------------- */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInCubic = p => p * p * p;
const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOutBack = p => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const seg = (t, t0, dur) => clamp01((t - t0) / dur);

/* ---------------- timeline ---------------- */
/* NOTE: several timings are mirrored by hand in make-audio.py (gust gliss
   2.55, closing chime 7.32, waddle boings 6.22/6.50, star-pop twinkle
   7.62) — edit both together */
const TL = {
  introFlake: 0.05,
  introL1: 0.45,
  introL2: 0.95,
  queenRaise: 1.98,
  introOut: 2.30,
  gust: 2.40,
  tiara: 2.85,
  name: 3.02,
  turns: 3.95,
  card: 4.72,
  rows: [5.02, 5.26, 5.50, 5.72, 5.88, 6.02],
  chars: 6.15,
  wave: 7.28,
  closing: 7.30,
  burstName: 2.95,
  burstClose: 7.32,
};

/* ---------------- star field ---------------- */
const stars = (() => {
  const r = mulberry32(20250904);
  const arr = [];
  for (let i = 0; i < 150; i++) {
    arr.push({
      x: r() * W,
      y: r() * 1180 * (0.25 + 0.75 * r()), // denser toward the top
      s: 0.6 + r() * 1.7,
      base: 0.25 + r() * 0.55,
      spd: 0.5 + r() * 1.6,
      ph: r() * Math.PI * 2,
      glint: r() > 0.93,
    });
  }
  return arr;
})();

/* Lyra — the constellation over Jamshedpur the evening Ziva was born.
   Vega at the head, the little parallelogram below. */
const LYRA = (() => {
  const S = 148, ox = 762, oy = 208;
  const p = (x, y) => ({ x: ox + x * S, y: oy + y * S });
  const stars = {
    vega: { ...p(0.00, 0.00), m: 3.4 },
    eps:  { ...p(0.30, -0.18), m: 1.5 },
    zeta: { ...p(0.36, 0.30), m: 1.7 },
    delta:{ ...p(0.88, 0.52), m: 1.6 },
    gamma:{ ...p(1.02, 1.10), m: 2.1 },
    beta: { ...p(0.60, 1.16), m: 2.0 },
  };
  const lines = [
    ['vega', 'eps'], ['eps', 'zeta'], ['vega', 'zeta'],
    ['zeta', 'delta'], ['delta', 'gamma'], ['gamma', 'beta'], ['beta', 'zeta'],
  ];
  return { stars, lines };
})();

/* ---------------- snow layers ---------------- */
function makeSnow(seed, n, sizeMin, sizeMax, fall, alpha) {
  const r = mulberry32(seed);
  const flakes = [];
  for (let i = 0; i < n; i++) {
    flakes.push({
      x0: r() * W, y0: r() * H,
      s: sizeMin + r() * (sizeMax - sizeMin),
      fall: fall * (0.75 + r() * 0.5),
      amp: 14 + r() * 46,
      fr: 0.25 + r() * 0.6,
      ph: r() * Math.PI * 2,
      a: alpha * (0.55 + r() * 0.45),
    });
  }
  return flakes;
}
const snowFar  = makeSnow(11, 90, 1.2, 2.6, 34, 0.5);
const snowMid  = makeSnow(22, 60, 2.6, 4.6, 62, 0.75);
const snowNear = makeSnow(33, 34, 4.5, 8.0, 105, 0.9);

function drawSnowLayer(ctx, flakes, t, blur) {
  for (const f of flakes) {
    const y = ((f.y0 + t * f.fall) % (H + 60)) - 30;
    let x = (f.x0 + Math.sin(t * f.fr + f.ph) * f.amp) % (W + 40);
    if (x < -20) x += W + 40;
    const g = ctx.createRadialGradient(x, y, 0, x, y, f.s * (blur ? 2.1 : 1.4));
    g.addColorStop(0, `rgba(240,249,255,${f.a})`);
    g.addColorStop(1, 'rgba(240,249,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, f.s * (blur ? 2.1 : 1.4), 0, 7);
    ctx.fill();
  }
}

/* ---------------- ornamental snowflake ---------------- */
function drawFlake(ctx, x, y, r, rot, alpha, lw, rgb, glowRgb) {
  if (alpha <= 0 || r <= 0) return;
  rgb = rgb || '110,160,210';       /* etched-in-ice blue for the daylight scene */
  glowRgb = glowRgb || '200,228,250';
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.strokeStyle = `rgba(${rgb},${alpha})`;
  ctx.lineWidth = lw || Math.max(1.1, r * 0.022);
  ctx.lineCap = 'round';
  ctx.shadowColor = `rgba(${glowRgb},${alpha * 0.9})`;
  ctx.shadowBlur = r * 0.16;
  for (let i = 0; i < 6; i++) {
    ctx.save();
    ctx.rotate(i * Math.PI / 3);
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.14);
    ctx.lineTo(0, -r);
    ctx.stroke();
    for (const [d, len] of [[0.38, 0.30], [0.60, 0.22], [0.80, 0.13]]) {
      for (const sgn of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(0, -r * d);
        ctx.lineTo(sgn * r * len * 0.72, -r * (d + len * 0.55));
        ctx.stroke();
      }
    }
    ctx.beginPath(); // tip diamond
    ctx.moveTo(0, -r);
    ctx.lineTo(r * 0.045, -r * 0.945);
    ctx.lineTo(0, -r * 0.89);
    ctx.lineTo(-r * 0.045, -r * 0.945);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); // centre hexagon
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3 - Math.PI / 2;
    const px = Math.cos(a) * r * 0.1, py = Math.sin(a) * r * 0.1;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

/* ---------------- sparkles ---------------- */
function drawSparkle(ctx, x, y, r, alpha, rot, rgb, glowRgb) {
  if (alpha <= 0 || r <= 0) return;
  rgb = rgb || '255,255,255';
  glowRgb = glowRgb || '180,220,255';
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.fillStyle = `rgba(${rgb},${alpha})`;
  ctx.shadowColor = `rgba(${glowRgb},${alpha})`;
  ctx.shadowBlur = r * 1.6;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    ctx.rotate(Math.PI / 2);
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r * 0.16, -r * 0.16, r, 0);
    ctx.quadraticCurveTo(r * 0.16, r * 0.16, 0, r);
  }
  ctx.fill();
  ctx.restore();
}

/* cartoon star-pops — little five-point stars that boing in and fade */
function makePops(seed, n, cx, cy, rx, ry, t0, span) {
  const r = mulberry32(seed);
  const pops = [];
  for (let i = 0; i < n; i++) {
    pops.push({
      x: cx + (r() - 0.5) * 2 * rx,
      y: cy + (r() - 0.5) * 2 * ry,
      s: 9 + r() * 13,
      t0: t0 + r() * span,
      life: 0.55 + r() * 0.3,
      rot: r() * 6.28,
    });
  }
  return pops;
}
const popsGust  = makePops(61, 7, 540, 690, 310, 260, 2.52, 0.45);
const popsClose = makePops(72, 9, 540, 1565, 330, 150, 7.36, 0.55);

function drawStarPop(ctx, x, y, r, p, rot) {
  const sc = easeOutBack(clamp01(p * 1.7));
  const a = p < 0.55 ? 1 : clamp01((1 - p) / 0.45);
  if (a <= 0 || sc <= 0) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot + p * 0.7);
  ctx.strokeStyle = `rgba(200,152,52,${a * 0.95})`;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.shadowColor = `rgba(244,208,120,${a * 0.85})`;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const ao = i * 1.2566 - Math.PI / 2, ai = ao + 0.6283;
    const px = Math.cos(ao) * r * sc, py = Math.sin(ao) * r * sc;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    ctx.lineTo(Math.cos(ai) * r * 0.42 * sc, Math.sin(ai) * r * 0.42 * sc);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawPops(ctx, pops, t) {
  for (const s of pops) {
    const p = (t - s.t0) / s.life;
    if (p > 0 && p < 1) drawStarPop(ctx, s.x, s.y, s.s, p, s.rot);
  }
}

function makeBurst(seed, n, cx, cy, radius, t0, life, rMin, rMax) {
  const r = mulberry32(seed);
  const parts = [];
  for (let i = 0; i < n; i++) {
    const ang = r() * Math.PI * 2;
    parts.push({
      ang,
      dist: radius * (0.35 + r() * 0.65),
      delay: r() * 0.25,
      life: life * (0.7 + r() * 0.6),
      size: rMin + r() * (rMax - rMin),
      spin: (r() - 0.5) * 3,
      cx, cy, t0,
    });
  }
  return parts;
}
const burstName  = makeBurst(41, 30, 540, 700, 470, TL.burstName, 1.25, 5, 15);
const burstClose = makeBurst(52, 20, 540, 1560, 330, TL.burstClose, 1.15, 4, 12);

function drawBurst(ctx, parts, t) {
  for (const p of parts) {
    const q = (t - p.t0 - p.delay) / p.life;
    if (q <= 0 || q >= 1) continue;
    const e = easeOutCubic(q);
    const x = p.cx + Math.cos(p.ang) * p.dist * e;
    const y = p.cy + Math.sin(p.ang) * p.dist * e - 20 * q;
    drawSparkle(ctx, x, y, p.size * (1 - 0.35 * q), (1 - q) * 0.95, p.spin * q * 6,
      '250,222,150', '240,190,90');
  }
}

/* ambient twinkles that live on the final layout */
const ambient = (() => {
  const r = mulberry32(77);
  const pts = [];
  for (let i = 0; i < 16; i++) {
    pts.push({
      x: 90 + r() * (W - 180),
      y: 380 + r() * 1180,
      s: 3 + r() * 6,
      spd: 0.6 + r() * 1.2,
      ph: r() * Math.PI * 2,
    });
  }
  return pts;
})();

/* ---------------- gust wipe streaks ---------------- */
const gustStreaks = (() => {
  const r = mulberry32(64);
  const arr = [];
  for (let i = 0; i < 46; i++) {
    arr.push({
      y: r() * H,
      len: 130 + r() * 320,
      w: 1.2 + r() * 2.6,
      off: r() * 0.5,
      a: 0.25 + r() * 0.55,
      drift: (r() - 0.5) * 140,
    });
  }
  return arr;
})();

/* ---------------- background ---------------- */
function drawAurora(ctx, t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const ribbons = [
    { base: 300, amp: 46, k: 0.0042, spd: 0.14, hue: 'rgba(255,255,255,', top: 0.10, hgt: 210 },
    { base: 385, amp: 60, k: 0.0035, spd: -0.10, hue: 'rgba(224,244,252,', top: 0.09, hgt: 250 },
    { base: 245, amp: 38, k: 0.0055, spd: 0.07, hue: 'rgba(236,232,252,', top: 0.07, hgt: 180 },
  ];
  for (const rb of ribbons) {
    for (let x = -20; x <= W + 20; x += 7) {
      const yc = rb.base + Math.sin(x * rb.k + t * rb.spd * 2 + rb.base) * rb.amp
               + Math.sin(x * rb.k * 2.7 + t * rb.spd * 3.1) * rb.amp * 0.35;
      const h = rb.hgt * (0.7 + 0.3 * Math.sin(x * 0.006 + t * 0.35 + rb.base));
      const g = ctx.createLinearGradient(0, yc - h, 0, yc);
      g.addColorStop(0, rb.hue + '0)');
      g.addColorStop(0.72, rb.hue + (rb.top) + ')');
      g.addColorStop(1, rb.hue + '0)');
      ctx.fillStyle = g;
      ctx.fillRect(x, yc - h, 7.5, h);
    }
  }
  ctx.restore();
}

/* winter sun — a soft warm-white disc with a halo ring (sun-dog) */
function drawSun(ctx) {
  const x = 216, y = 258;
  ctx.save();
  const glow = ctx.createRadialGradient(x, y, 8, x, y, 170);
  glow.addColorStop(0, 'rgba(255,252,240,0.85)');
  glow.addColorStop(0.35, 'rgba(255,248,228,0.30)');
  glow.addColorStop(1, 'rgba(255,248,228,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y, 170, 0, 7); ctx.fill();
  ctx.fillStyle = '#fffdf4';
  ctx.shadowColor = 'rgba(255,250,230,0.95)';
  ctx.shadowBlur = 34;
  ctx.beginPath(); ctx.arc(x, y, 42, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  /* faint halo ring */
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(x, y, 108, 0, 7); ctx.stroke();
  ctx.restore();
}

function drawStars(ctx, t) {
  /* daylight scene: the star field becomes faint diamond-dust in the air */
  for (const s of stars) {
    const tw = s.base * (0.55 + 0.45 * Math.sin(t * s.spd * 2 + s.ph)) * 0.4;
    ctx.fillStyle = `rgba(255,255,255,${tw})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill();
    if (s.glint && tw > s.base * 0.28) {
      ctx.strokeStyle = `rgba(255,255,255,${tw * 0.6})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(s.x - s.s * 4, s.y); ctx.lineTo(s.x + s.s * 4, s.y);
      ctx.moveTo(s.x, s.y - s.s * 4); ctx.lineTo(s.x, s.y + s.s * 4);
      ctx.stroke();
    }
  }
}

function drawLyra(ctx, t) {
  /* breathes a little brighter while Ziva's name is on screen */
  const lift = 0.5 + 0.5 * easeInOut(seg(t, 3.1, 1.6)) - 0.25 * easeInOut(seg(t, 8.6, 1.2));
  const lineA = 0.07 + 0.07 * lift;  /* etched faintly into the bright sky */
  ctx.save();
  ctx.strokeStyle = `rgba(90,140,190,${lineA})`;
  ctx.lineWidth = 1;
  for (const [a, b] of LYRA.lines) {
    const A = LYRA.stars[a], B = LYRA.stars[b];
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
  }
  for (const key of Object.keys(LYRA.stars)) {
    const s = LYRA.stars[key];
    const tw = 0.55 + 0.45 * Math.sin(t * 1.4 + s.x);
    const r = s.m * (key === 'vega' ? 1.25 : 0.95);
    ctx.fillStyle = `rgba(255,255,255,${(0.35 + 0.4 * lift) * tw})`;
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = key === 'vega' ? 14 * lift + 5 : 4;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.fill();
  }
  ctx.shadowBlur = 0;
  /* Vega's glint */
  const v = LYRA.stars.vega;
  const va = (0.22 + 0.32 * lift) * (0.7 + 0.3 * Math.sin(t * 2.1));
  ctx.strokeStyle = `rgba(255,255,255,${va})`;
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(v.x - 15, v.y); ctx.lineTo(v.x + 15, v.y);
  ctx.moveTo(v.x, v.y - 15); ctx.lineTo(v.x, v.y + 15);
  ctx.stroke();
  ctx.restore();
}

/* ---------------- the snow queen ---------------- */
/* Queen v2 — foreground stage, storybook-coloured, house cartoon idiom.
   Original design throughout: golden hair (not platinum-white), teal gown
   (not pale ice-blue), generic tiara, no snowflake motifs on gown/cape. */
const QS = 1.6, QX = 150, QY = 1802; /* feet on the near drift, in front */
function queenHand(t) {
  /* arm pose: rest → raised at the conjuring, easing to a graceful hold */
  const up = easeInOut(seg(t, TL.queenRaise, 0.5)) * (1 - 0.42 * easeInOut(seg(t, 3.5, 0.9)));
  return { up, x: QX + (26 + up * 12) * QS, y: QY - (86 + up * 64) * QS };
}

function drawQueen(ctx, t) {
  const a = easeInOut(seg(t, 1.5, 0.6));
  if (a <= 0) return;
  const sway = Math.sin(t * 0.7) * 0.01;
  const { up } = queenHand(t);
  ctx.save();
  ctx.translate(QX, QY);
  ctx.scale(QS, QS);
  ctx.rotate(sway);
  ctx.globalAlpha = a;

  /* warm spotlight so she lifts off the bright drift */
  const spot = ctx.createRadialGradient(0, -72, 8, 0, -72, 96);
  spot.addColorStop(0, 'rgba(255,244,214,0.4)');
  spot.addColorStop(1, 'rgba(255,244,214,0)');
  ctx.fillStyle = spot;
  ctx.beginPath(); ctx.arc(0, -72, 96, 0, 7); ctx.fill();

  ctx.fillStyle = 'rgba(16,44,78,0.3)';
  ctx.beginPath(); ctx.ellipse(3, 1, 42, 8, 0, 0, 7); ctx.fill();

  /* flowing cape behind, slow ripple */
  ctx.beginPath();
  ctx.moveTo(-8, -104);
  ctx.bezierCurveTo(-34, -80 + Math.sin(t * 1.1) * 4, -58, -40, -70 + Math.sin(t * 0.9) * 5, -2);
  ctx.lineTo(-34, 0);
  ctx.bezierCurveTo(-22, -42, -13, -74, -9, -100);
  ctx.closePath();
  ctx.fillStyle = 'rgba(150,214,228,0.35)';
  ctx.fill();

  /* skirt — rich teal A-line with a train to the right */
  const g = ctx.createLinearGradient(0, -112, 0, 0);
  g.addColorStop(0, '#9adfe0');
  g.addColorStop(0.5, '#63b9cf');
  g.addColorStop(1, '#3f88b8');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-40, 0);
  ctx.bezierCurveTo(-24, -36, -13, -66, -10, -92);
  ctx.lineTo(10, -92);
  ctx.bezierCurveTo(14, -64, 26, -34, 54, 0);
  ctx.closePath();
  ctx.fill();
  /* hem sheen + skirt light band */
  ctx.strokeStyle = 'rgba(224,248,250,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-36, -3); ctx.quadraticCurveTo(6, -13, 50, -3); ctx.stroke();
  ctx.fillStyle = 'rgba(230,250,252,0.2)';
  ctx.beginPath();
  ctx.moveTo(-6, -90); ctx.bezierCurveTo(-14, -50, -18, -26, -24, -4);
  ctx.lineTo(-12, -4); ctx.bezierCurveTo(-8, -30, -4, -60, 0, -90);
  ctx.closePath(); ctx.fill();
  /* rim light on the moonlit side */
  ctx.strokeStyle = 'rgba(242,250,255,0.7)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-40, 0);
  ctx.bezierCurveTo(-24, -36, -13, -66, -10, -92);
  ctx.stroke();

  /* bodice — fitted, soft sweetheart neckline */
  const bg3 = ctx.createLinearGradient(0, -114, 0, -88);
  bg3.addColorStop(0, '#bdeeea');
  bg3.addColorStop(1, '#79c4d4');
  ctx.fillStyle = bg3;
  ctx.beginPath();
  ctx.moveTo(-10, -92);
  ctx.lineTo(-11, -109);
  ctx.quadraticCurveTo(-6, -113, 0, -112);
  ctx.quadraticCurveTo(6, -113, 11, -109);
  ctx.lineTo(10, -92);
  ctx.closePath(); ctx.fill();

  /* resting arm along the skirt */
  const rhx = -20 + Math.sin(t * 0.9);
  ctx.strokeStyle = '#8fd0da';
  ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-10, -105); ctx.quadraticCurveTo(-18, -84, rhx, -62); ctx.stroke();
  ctx.fillStyle = '#f6dcc8';
  ctx.beginPath(); ctx.arc(rhx, -60, 2.8, 0, 7); ctx.fill();

  /* neck + head — fair skin */
  ctx.fillStyle = '#f6dcc8';
  ctx.fillRect(-2.4, -119, 4.8, 8);
  ctx.beginPath(); ctx.arc(0, -128, 10, 0, 7); ctx.fill();

  /* golden hair — swept crown + thick side braid */
  ctx.fillStyle = '#f2d488';
  ctx.beginPath(); ctx.arc(0, -131.5, 9.8, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-6.5, -134, 5.5, 4, -0.5, 0, 7); ctx.fill();
  for (let i = 0; i < 7; i++) {
    const bx = -8.5 - i * 1.6, by = -122 + i * 7.2;
    ctx.fillStyle = i % 2 ? '#e8c470' : '#f2d488';
    ctx.beginPath(); ctx.arc(bx, by, 5.2 - i * 0.42, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#cfeef2'; /* braid tie */
  ctx.beginPath(); ctx.arc(-18.6, -75.4, 1.7, 0, 7); ctx.fill();

  /* tiny silver tiara */
  ctx.strokeStyle = '#eef8ff';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-5.5, -138.5); ctx.lineTo(-3.2, -143.5);
  ctx.moveTo(0, -139.5); ctx.lineTo(0, -146);
  ctx.moveTo(5.5, -138.5); ctx.lineTo(3.2, -143.5);
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, -147, 1.3, 0, 7); ctx.fill();

  /* face — house idiom: dot eyes with blinks, soft smile, blush */
  ctx.fillStyle = '#31414f';
  if (blink(t, 3.8, 1.2)) {
    ctx.strokeStyle = '#31414f';
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(-5.4, -128.5); ctx.lineTo(-2.2, -128.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2.2, -128.5); ctx.lineTo(5.4, -128.5); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-3.8, -128.5, 1.35, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(3.8, -128.5, 1.35, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = '#b25f52';
  ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(0, -125.2, 3, Math.PI * 0.25, Math.PI * 0.75); ctx.stroke();
  ctx.fillStyle = 'rgba(240,158,148,0.4)';
  ctx.beginPath(); ctx.arc(-6.9, -125.5, 2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(6.9, -125.5, 2, 0, 7); ctx.fill();

  /* conjuring arm — sleeve + skin hand + glint */
  const sx = 10, sy = -107;
  const hx = 26 + up * 12, hy = -86 - up * 64;
  const mx = (sx + hx) / 2 + 6 * up, my = (sy + hy) / 2 + 4;
  ctx.strokeStyle = '#8fd0da';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, hx, hy); ctx.stroke();
  ctx.fillStyle = '#f6dcc8';
  ctx.beginPath(); ctx.arc(hx, hy, 3, 0, 7); ctx.fill();
  const glint = up * (0.5 + 0.5 * Math.sin(t * 6));
  drawSparkle(ctx, hx, hy - 4, 6.5, glint * 0.95, t * 1.5);

  /* frost sparkles woven through the gown (plain glints, no motifs) */
  const qr = mulberry32(19);
  for (let i = 0; i < 9; i++) {
    const gx = -20 + qr() * 50, gy = -12 - qr() * 84, ph = qr() * 6.28;
    const tw = Math.max(0, Math.sin(t * 1.8 + ph));
    ctx.fillStyle = `rgba(255,255,255,${tw * 0.6})`;
    ctx.beginPath(); ctx.arc(gx, gy, 1.4, 0, 7); ctx.fill();
  }
  ctx.restore();

  /* magic stream: sparkles arcing from her hand up toward the name reveal */
  const { x: hax, y: hay } = queenHand(t);
  const sr = mulberry32(87);
  for (let i = 0; i < 16; i++) {
    const birth = 2.28 + i * 0.05, life = 0.85;
    const jx = (sr() - 0.5) * 90, jy = (sr() - 0.5) * 70, sz = 3.5 + sr() * 4.5;
    const p = (t - birth) / life;
    if (p <= 0 || p >= 1) continue;
    const e = easeOutCubic(p);
    const px = hax + (540 + jx - hax) * e - 180 * Math.sin(Math.PI * e) * 0.6;
    const py = hay + (640 + jy - hay) * e - 120 * Math.sin(Math.PI * e);
    drawSparkle(ctx, px, py, sz * (1 - 0.4 * p), (1 - p) * 0.9, p * 5, '120,175,230', '190,225,255');
  }
  /* idle magic: a slow drip of sparkles rising from her hand afterwards */
  if (t > 3.6) {
    for (let i = 0; i < 3; i++) {
      const p = ((t - 3.6) / 2.2 + i / 3) % 1;
      const px = hax + Math.sin(p * 9 + i * 2.1) * 10;
      const py = hay - p * 52;
      drawSparkle(ctx, px, py, 3.4, Math.sin(p * Math.PI) * 0.55, p * 6 + i, '120,175,230', '190,225,255');
    }
  }
}

/* crystalline ice castle on the horizon — faceted spires, tiny gold windows */
function drawCastle(ctx, t, cx, base, s) {
  ctx.save();
  ctx.translate(cx, base);
  ctx.scale(s, s);
  const spires = [
    [-58, 96, 20], [-30, 148, 24], [0, 196, 30], [34, 132, 22], [60, 84, 17],
  ];
  for (const [sx, h, w] of spires) {
    /* lit face */
    ctx.fillStyle = '#e6f2fb';
    ctx.beginPath();
    ctx.moveTo(sx - w / 2, 0); ctx.lineTo(sx - w / 2, -h * 0.72);
    ctx.lineTo(sx, -h); ctx.lineTo(sx, 0);
    ctx.closePath(); ctx.fill();
    /* shaded face */
    ctx.fillStyle = '#b3d2ec';
    ctx.beginPath();
    ctx.moveTo(sx, 0); ctx.lineTo(sx, -h);
    ctx.lineTo(sx + w / 2, -h * 0.72); ctx.lineTo(sx + w / 2, 0);
    ctx.closePath(); ctx.fill();
    /* spire tip glint */
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(sx, -h, 1.6, 0, 7); ctx.fill();
  }
  /* connecting wall */
  ctx.fillStyle = '#cfe4f5';
  ctx.fillRect(-64, -34, 128, 34);
  ctx.fillStyle = '#a9c9e6';
  for (let i = 0; i < 5; i++) ctx.fillRect(-64 + 6 + i * 26, -40, 12, 6); /* battlements */
  /* tiny warm windows */
  const wt = 0.7 + 0.3 * Math.sin(t * 1.1);
  ctx.fillStyle = `rgba(240,196,110,${0.85 * wt})`;
  for (const [wx, wy] of [[-30, -84], [0, -120], [34, -76], [2, -60]]) {
    ctx.fillRect(wx - 1.6, wy, 3.2, 5.5);
  }
  ctx.restore();
}

/* faceted crystal shard cluster */
function drawCrystals(ctx, cx, cy, s, flip) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(flip ? -s : s, s);
  const shards = [[0, 0, 26, 118, -0.14], [24, 6, 20, 82, 0.12], [-20, 8, 15, 62, -0.34]];
  for (const [sx, sy, w, h, rot] of shards) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(rot);
    ctx.fillStyle = 'rgba(214,236,250,0.85)';
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2 + w * 0.18, -h * 0.7);
    ctx.lineTo(0, -h); ctx.lineTo(w / 2 - w * 0.18, -h * 0.7); ctx.lineTo(w / 2, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(178,196,238,0.55)'; /* cool violet facet */
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -h);
    ctx.lineTo(w / 2 - w * 0.18, -h * 0.7); ctx.lineTo(w / 2, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-w / 2 + w * 0.18, -h * 0.7); ctx.lineTo(0, -h); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawGround(ctx, t) {
  /* castle on the horizon, peeking over the far ridge */
  drawCastle(ctx, t, 790, 1668, 0.95);
  /* far ridge with pines */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, 1700);
  ctx.quadraticCurveTo(270, 1622, 560, 1668);
  ctx.quadraticCurveTo(840, 1710, W, 1650);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  const gFar = ctx.createLinearGradient(0, 1620, 0, H);
  gFar.addColorStop(0, '#a7c9e6');
  gFar.addColorStop(1, '#8db2d6');
  ctx.fillStyle = gFar;
  ctx.fill();
  /* pines on the ridge */
  const pines = [[120, 1668, 74], [205, 1680, 52], [872, 1672, 66], [948, 1662, 46]];
  for (const [px, py, ph] of pines) {
    ctx.fillStyle = '#39668f';
    for (let l = 0; l < 3; l++) {
      const w = ph * (0.52 - l * 0.13), yy = py - l * ph * 0.3;
      ctx.beginPath();
      ctx.moveTo(px, yy - ph * 0.55);
      ctx.lineTo(px - w, yy);
      ctx.lineTo(px + w, yy);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(223,240,255,0.5)';
    ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px - ph * 0.30, py - ph * 0.13);
    ctx.lineTo(px, py - ph * 0.3);
    ctx.lineTo(px + ph * 0.24, py - ph * 0.16);
    ctx.stroke();
  }
  /* near drift */
  ctx.beginPath();
  ctx.moveTo(0, 1810);
  ctx.quadraticCurveTo(230, 1738, 540, 1782);
  ctx.quadraticCurveTo(830, 1822, W, 1758);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  const gNear = ctx.createLinearGradient(0, 1730, 0, H);
  gNear.addColorStop(0, '#ffffff');
  gNear.addColorStop(0.5, '#e4f1fb');
  gNear.addColorStop(1, '#c2dcf1');
  ctx.fillStyle = gNear;
  ctx.shadowColor = 'rgba(255,255,255,0.95)';
  ctx.shadowBlur = 26;
  ctx.fill();
  ctx.shadowBlur = 0;
  /* crystal shards framing the drifts */
  drawCrystals(ctx, 46, 1748, 1.0, false);
  drawCrystals(ctx, 1036, 1724, 1.15, true);
  /* golden twinkles in the snow */
  const r = mulberry32(99);
  for (let i = 0; i < 14; i++) {
    const x = r() * W, y = 1790 + r() * 110, ph = r() * 6.28, sp = 0.8 + r();
    const a = 0.25 + 0.75 * Math.max(0, Math.sin(t * sp * 2 + ph));
    drawSparkle(ctx, x, y, 2.6 + r() * 2.4, a * 0.7, ph, '242,207,122', '238,190,100');
  }
  ctx.restore();
}

function renderBG(t) {
  bg.clearRect(0, 0, W, H);
  drawAurora(bg, t);
  drawStars(bg, t);
  drawLyra(bg, t);
  drawSun(bg);
  /* giant watermark flake behind the name, once the main layout is up */
  const wmIn = easeInOut(seg(t, 2.6, 1.4));
  drawFlake(bg, 540, 700, 330, t * 0.05, 0.075 * wmIn, 2);
  /* bold edge flakes, movie-poster style */
  const efIn = easeInOut(seg(t, 0.4, 1.2));
  drawFlake(bg, 54, 940, 76, t * 0.03, 0.13 * efIn, 1.6);
  drawFlake(bg, 1030, 1200, 88, -t * 0.025, 0.12 * efIn, 1.6);
  drawFlake(bg, 1044, 620, 54, t * 0.04, 0.10 * efIn, 1.4);
  drawGround(bg, t);
  drawSnowLayer(bg, snowFar, t, false);
  drawSnowLayer(bg, snowMid, t, false);
}

/* ---------------- the party hosts ----------------
   A carrot-nosed, scarf-wearing snowman (deliberately classic — not any
   studio's character) waddles in with Ziva's cake, an arctic fox trotting
   behind. They wave at "See you there!" and hold the pose for the still. */
function ballGrad(ctx, x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r * 1.05);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.75, '#eaf3fc');
  g.addColorStop(1, '#c9dff2');
  return g;
}

function waveAngle(t) {
  /* arm swings up with a boing, then a damped goodbye wave */
  const lift = easeOutBack(seg(t, TL.wave, 0.45));
  let osc = 0;
  if (t > TL.wave + 0.5) osc = Math.sin((t - TL.wave - 0.5) * 6.5) * 0.3 * Math.exp(-(t - TL.wave - 0.5) * 1.1);
  return -0.55 - lift * 1.5 + osc;
}

/* deterministic blink gate: eyes shut for ~0.13s on a fixed period */
const blink = (t, period, off) => ((t + off) % period) > period - 0.13;

function drawSnowman(ctx, t) {
  const p = easeOutCubic(seg(t, TL.chars, 0.9));
  if (p <= 0) return;
  const x = 1196 - 346 * p;              /* enters from the right, stops at x = 850 */
  const phase = p * 6.5;                 /* waddle cycles tied to travel */
  const moving = 1 - seg(t, TL.chars + 0.72, 0.25);
  const bob = Math.abs(Math.sin(phase * Math.PI)) * 6 * moving;
  const tilt = Math.sin(phase * 2 * Math.PI) * 0.055 * moving;
  const y = 1830 - bob;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1.4, 1.4);
  ctx.rotate(tilt);

  /* soft spotlight + contact shadow */
  const spot = ctx.createRadialGradient(0, -70, 8, 0, -70, 90);
  spot.addColorStop(0, 'rgba(255,244,214,0.35)');
  spot.addColorStop(1, 'rgba(255,244,214,0)');
  ctx.fillStyle = spot;
  ctx.beginPath(); ctx.arc(0, -70, 90, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(16,44,78,0.28)';
  ctx.beginPath(); ctx.ellipse(0, 2, 40, 9, 0, 0, 7); ctx.fill();

  /* twig arm holding the cake plate (his right, screen-left) */
  ctx.strokeStyle = '#5a4636';
  ctx.lineCap = 'round';
  ctx.lineWidth = 3.6;
  ctx.beginPath(); ctx.moveTo(-18, -80); ctx.quadraticCurveTo(-34, -76, -42, -84); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-36, -80); ctx.lineTo(-41, -74); ctx.stroke(); /* fork */

  /* body — three classic snowballs */
  ctx.fillStyle = ballGrad(ctx, 0, -32, 34);
  ctx.beginPath(); ctx.arc(0, -32, 34, 0, 7); ctx.fill();
  ctx.fillStyle = ballGrad(ctx, 0, -78, 25);
  ctx.beginPath(); ctx.arc(0, -78, 25, 0, 7); ctx.fill();
  ctx.fillStyle = ballGrad(ctx, 0, -116, 18.5);
  ctx.beginPath(); ctx.arc(0, -116, 18.5, 0, 7); ctx.fill();

  /* amber knit cap with a snowy pom */
  ctx.fillStyle = '#dfa963';
  ctx.beginPath(); ctx.arc(0, -124, 16, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8b86d';
  ctx.beginPath(); ctx.roundRect(-17, -127, 34, 6, 3); ctx.fill();
  ctx.fillStyle = '#fdf6ec';
  ctx.beginPath(); ctx.arc(0, -141, 4.5, 0, 7); ctx.fill();

  /* coal buttons */
  ctx.fillStyle = '#31414f';
  for (const by of [-72, -82]) { ctx.beginPath(); ctx.arc(0, by, 2.1, 0, 7); ctx.fill(); }

  /* waving twig arm (his left, screen-right) — pivots at the shoulder */
  const wa = waveAngle(t);
  ctx.save();
  ctx.translate(15, -84);
  ctx.rotate(wa);
  ctx.strokeStyle = '#5a4636';
  ctx.lineWidth = 3.6;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, 2, 26, -2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(19, -1); ctx.lineTo(24, 5); ctx.stroke(); /* fork */
  ctx.restore();

  /* scarf — sage, with a fluttering tail */
  ctx.strokeStyle = '#8ec9aa';
  ctx.lineCap = 'round';
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(0, -98, 14, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  ctx.lineWidth = 6.5;
  const fl = Math.sin(t * 3.1) * 4;
  ctx.beginPath(); ctx.moveTo(9, -94); ctx.quadraticCurveTo(16, -78 + fl * 0.4, 12 + fl, -66); ctx.stroke();

  /* face: coal eyes (happy arcs once he waves), blush, smile, carrot */
  ctx.strokeStyle = '#31414f';
  ctx.fillStyle = '#31414f';
  if (t < TL.wave + 0.3) {
    if (blink(t, 3.4, 0.6)) {
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(-8.5, -120); ctx.lineTo(-4.5, -120); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4.5, -120); ctx.lineTo(8.5, -120); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(-6.5, -120, 2.1, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(6.5, -120, 2.1, 0, 7); ctx.fill();
    }
  } else {
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-6.5, -119, 3.2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(6.5, -119, 3.2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(242,158,178,0.65)';
  ctx.beginPath(); ctx.arc(-11, -113, 3.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(11, -113, 3.2, 0, 7); ctx.fill();
  ctx.strokeStyle = '#31414f';
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, -113, 6.5, Math.PI * 0.25, Math.PI * 0.75); ctx.stroke();
  ctx.fillStyle = '#e8a95d';
  ctx.beginPath();
  ctx.moveTo(1, -118); ctx.lineTo(15, -114.5); ctx.lineTo(1, -112.5);
  ctx.closePath(); ctx.fill();

  /* the birthday cake on its plate */
  ctx.save();
  ctx.translate(-46, -88);
  ctx.fillStyle = '#e8f2fc';
  ctx.beginPath(); ctx.ellipse(0, 6, 15, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fad4b4';
  ctx.beginPath(); ctx.roundRect(-12, -6, 24, 11, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-8, -14, 16, 9, 2); ctx.fill();
  ctx.fillStyle = '#fdf3f6';                     /* frosting drips */
  ctx.beginPath(); ctx.roundRect(-8, -14, 16, 3.4, 1.6); ctx.fill();
  for (const dx of [-5, 0, 5]) { ctx.beginPath(); ctx.arc(dx, -10.6, 1.9, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#f2a8b8';                     /* candle */
  ctx.fillRect(-1.4, -21, 2.8, 7);
  const fk = 1 + 0.18 * Math.sin(t * 11);        /* flame flicker */
  ctx.fillStyle = '#f4c67a';
  ctx.shadowColor = 'rgba(250,210,140,0.9)';
  ctx.shadowBlur = 9;
  ctx.beginPath(); ctx.ellipse(0, -24.5, 2 * fk, 3.4 * fk, 0, 0, 7); ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawFox(ctx, t) {
  const p = easeOutCubic(seg(t, TL.chars + 0.18, 0.9));
  if (p <= 0) return;
  const x = -160 + 462 * p;              /* stops at x = 302, front of the queen */
  const phase = p * 8;
  const moving = 1 - seg(t, TL.chars + 0.88, 0.25);
  const bob = Math.abs(Math.sin(phase * Math.PI)) * 4 * moving;
  const y = 1792 - bob;
  const idle = moving < 0.05 ? Math.sin(t * 1.6) * 1.2 : 0;
  ctx.save();
  ctx.translate(x, y + idle * 0.4);
  ctx.scale(1.35, 1.35);

  /* soft spotlight + contact shadow */
  const spot = ctx.createRadialGradient(4, -22, 4, 4, -22, 52);
  spot.addColorStop(0, 'rgba(240,180,120,0.13)');
  spot.addColorStop(1, 'rgba(240,180,120,0)');
  ctx.fillStyle = spot;
  ctx.beginPath(); ctx.arc(4, -22, 52, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(16,44,78,0.28)';
  ctx.beginPath(); ctx.ellipse(2, 2, 30, 6.5, 0, 0, 7); ctx.fill();

  /* tail — big, bushy, red with a white tip, swishing once she settles */
  const swish = -0.32 + Math.sin(t * 2.2) * 0.17 * (1 - moving * 0.6);
  ctx.save();
  ctx.translate(-22, -22);
  ctx.rotate(swish);
  const tg = ctx.createLinearGradient(4, 4, -34, -16);
  tg.addColorStop(0, '#d9803f');
  tg.addColorStop(0.62, '#e8944e');
  tg.addColorStop(0.82, '#fdf3e4');
  tg.addColorStop(1, '#ffffff');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(4, 5);
  ctx.quadraticCurveTo(-14, 9, -28, -2);
  ctx.quadraticCurveTo(-37, -10, -33, -17);
  ctx.quadraticCurveTo(-26, -21, -16, -16);
  ctx.quadraticCurveTo(-6, -11, 4, -6);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  /* legs — deep auburn stockings, trot lifts while moving */
  ctx.strokeStyle = '#8a5030';
  ctx.lineCap = 'round';
  ctx.lineWidth = 5;
  for (const [lx, ph] of [[-13, 0], [-6, Math.PI], [8, Math.PI], [15, 0]]) {
    const lift = Math.max(0, Math.sin(phase * 2 * Math.PI + ph)) * 4 * moving;
    ctx.beginPath(); ctx.moveTo(lx, -14); ctx.lineTo(lx + 1, -2 - lift); ctx.stroke();
  }

  /* body — warm rust with a cream chest */
  const bg2 = ctx.createLinearGradient(0, -36, 0, -6);
  bg2.addColorStop(0, '#e8944e');
  bg2.addColorStop(1, '#c96f38');
  ctx.fillStyle = bg2;
  ctx.beginPath(); ctx.ellipse(0, -21, 25, 13.5, -0.06, 0, 7); ctx.fill();
  ctx.fillStyle = '#fdf3e4';
  ctx.beginPath(); ctx.ellipse(14, -20, 9, 8, 0.3, 0, 7); ctx.fill();

  /* head + white cheeks, pointed muzzle, black nose */
  ctx.fillStyle = '#e8944e';
  ctx.beginPath(); ctx.arc(20, -33, 10.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#fdf3e4';                      /* cheek/muzzle underside */
  ctx.beginPath();
  ctx.moveTo(22, -28.5);
  ctx.quadraticCurveTo(30, -30, 35.5, -26);
  ctx.quadraticCurveTo(29, -22.5, 22, -24.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8944e';                      /* pointed snout top */
  ctx.beginPath();
  ctx.moveTo(27, -32); ctx.quadraticCurveTo(33, -30, 35.5, -26.5);
  ctx.quadraticCurveTo(30, -27.5, 26, -28.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2b3540';                      /* nose */
  ctx.beginPath(); ctx.arc(35.2, -26.2, 1.8, 0, 7); ctx.fill();

  /* tall ears — dark-backed, cream inner */
  for (const [ex, er] of [[13, -0.24], [23, 0.2]]) {
    ctx.save();
    ctx.translate(ex, -41); ctx.rotate(er);
    ctx.fillStyle = '#b05f30';
    ctx.beginPath(); ctx.moveTo(-4.2, 2.5); ctx.lineTo(0, -9.5); ctx.lineTo(4.2, 2.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fdeedd';
    ctx.beginPath(); ctx.moveTo(-2, 1.2); ctx.lineTo(0, -5.6); ctx.lineTo(2, 1.2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* eye — blink, then happy arc at the wave */
  ctx.fillStyle = '#2b3540';
  if (t < TL.wave + 0.3) {
    if (blink(t, 4.1, 1.7)) {
      ctx.strokeStyle = '#2b3540';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(19.2, -34); ctx.lineTo(22.8, -34); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(21, -34, 1.8, 0, 7); ctx.fill();
    }
  } else {
    ctx.strokeStyle = '#2b3540';
    ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.arc(21, -33.4, 2.6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- foreground ---------------- */
function renderFG(t) {
  fg.clearRect(0, 0, W, H);

  /* intro hero flake — crystallizes, then dissolves into the gust */
  const inP = easeOutCubic(seg(t, TL.introFlake, 1.7));
  const outP = easeInCubic(seg(t, TL.introOut, 0.55));
  if (inP > 0 && outP < 1) {
    const r = 30 + 185 * inP;
    const a = (0.28 + 0.62 * inP) * (1 - outP);
    drawFlake(fg, 540, 596, r * (1 + outP * 0.35), t * 0.22, a, 2.4);
    /* two satellites */
    drawFlake(fg, 260, 430, 46 * inP, -t * 0.4, 0.4 * inP * (1 - outP), 1.4);
    drawFlake(fg, 838, 486, 34 * inP, t * 0.5, 0.35 * inP * (1 - outP), 1.2);
  }

  /* tiara flake above the name */
  const tiP = seg(t, TL.tiara, 0.7);
  if (tiP > 0) {
    const sc = easeOutBack(tiP);
    drawFlake(fg, 540, 424, 56 * sc, t * 0.18, 0.95 * clamp01(tiP * 2), 2);
    drawFlake(fg, 390, 446, 21 * sc, -t * 0.3, 0.55 * clamp01(tiP * 2), 1.3);
    drawFlake(fg, 690, 446, 21 * sc, t * 0.3, 0.55 * clamp01(tiP * 2), 1.3);
  }

  /* gust wipe */
  const gp = seg(t, TL.gust, 0.62);
  if (gp > 0 && gp < 1) {
    const e = easeInOut(gp);
    fg.save();
    fg.lineCap = 'round';
    for (const s of gustStreaks) {
      const sp = clamp01((e - s.off * 0.4) / 0.6);
      if (sp <= 0 || sp >= 1) continue;
      const x = -350 + (W + 700) * sp;
      const y = s.y + s.drift * sp;
      const grad = fg.createLinearGradient(x - s.len, y, x, y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(1, `rgba(255,255,255,${s.a * Math.sin(sp * Math.PI)})`);
      fg.strokeStyle = grad;
      fg.lineWidth = s.w;
      fg.beginPath();
      fg.moveTo(x - s.len, y + s.len * 0.06);
      fg.lineTo(x, y);
      fg.stroke();
    }
    /* soft flash at the crest */
    const flash = Math.sin(clamp01((gp - 0.25) / 0.6) * Math.PI) * 0.30;
    if (flash > 0) {
      fg.fillStyle = `rgba(226,242,255,${flash})`;
      fg.fillRect(0, 0, W, H);
    }
    fg.restore();
  }

  /* sparkle bursts + cartoon star-pops */
  drawBurst(fg, burstName, t);
  drawBurst(fg, burstClose, t);
  drawPops(fg, popsGust, t);
  drawPops(fg, popsClose, t);

  /* the party arrives along the drifts — queen behind, fox and snowman in front */
  drawQueen(fg, t);
  drawFox(fg, t);
  drawSnowman(fg, t);

  /* ambient twinkles once the layout is up */
  const ambIn = easeInOut(seg(t, 4.4, 1.2));
  if (ambIn > 0) {
    ambient.forEach((p, i) => {
      const a = Math.max(0, Math.sin(t * p.spd * 1.6 + p.ph));
      if (i % 2) drawSparkle(fg, p.x, p.y, p.s, a * a * 0.45 * ambIn, p.ph + t * 0.4, '246,214,134', '238,190,100');
      else drawSparkle(fg, p.x, p.y, p.s, a * a * 0.4 * ambIn, p.ph + t * 0.4, '150,190,230', '190,220,250');
    });
  }

  /* near snow — always on top */
  drawSnowLayer(fg, snowNear, t, true);

  /* frosted corners + icy frame */
  frostFrame(fg, t);

  /* opening fade from white */
  const open = 1 - easeOutCubic(seg(t, 0, 0.8));
  if (open > 0) {
    fg.fillStyle = `rgba(228,242,255,${open})`;
    fg.fillRect(0, 0, W, H);
  }
}

function frostFrame(ctx, t) {
  const a = 0.6 + 0.4 * easeInOut(seg(t, 0.3, 1.2));
  ctx.save();
  /* corner frost glows */
  for (const [cx, cy] of [[0, 0], [W, 0], [0, H], [W, H]]) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 360);
    g.addColorStop(0, `rgba(255,255,255,${0.30 * a})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - 360, cy - 360, 720, 720);
  }
  /* thin icy border */
  ctx.strokeStyle = `rgba(90,140,190,${0.32 * a})`;
  ctx.lineWidth = 2;
  const m = 30, rr = 26;
  ctx.beginPath();
  ctx.roundRect(m, m, W - 2 * m, H - 2 * m, rr);
  ctx.stroke();
  ctx.strokeStyle = `rgba(90,140,190,${0.13 * a})`;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.roundRect(m + 7, m + 7, W - 2 * (m + 7), H - 2 * (m + 7), rr - 6);
  ctx.stroke();
  /* corner mini-flakes */
  for (const [fx, fy] of [[m + 34, m + 34], [W - m - 34, m + 34], [m + 34, H - m - 34], [W - m - 34, H - m - 34]]) {
    drawFlake(ctx, fx, fy, 17, t * 0.12, 0.5 * a, 1.2);
  }
  ctx.restore();
}

/* ---------------- DOM text ---------------- */
const $ = id => document.getElementById(id);
const els = {
  introL1: $('introL1'), introL2: $('introL2'),
  name: $('name'), letters: Array.from($('name').children),
  turns: $('turns'), one: $('one'), card: $('card'),
  rows: ['rowKicker', 'rowDay', 'rowDate', 'rowTime', 'rowVenueKicker', 'rowVenue'].map($),
  closing: $('closing'),
};

function fadeRise(el, t, t0, dur, dy, blurPx) {
  const p = easeOutCubic(seg(t, t0, dur));
  el.style.opacity = p;
  el.style.transform = `translateY(${(1 - p) * dy}px)`;
  el.style.filter = blurPx ? `blur(${(1 - p) * blurPx}px)` : '';
  return p;
}

function renderDOM(t) {
  /* intro lines: in, then out through the gust */
  const outP = easeInCubic(seg(t, TL.introOut, 0.5));
  for (const [el, t0, dy] of [[els.introL1, TL.introL1, 46], [els.introL2, TL.introL2, 46]]) {
    const p = easeOutCubic(seg(t, t0, 0.85));
    const op = p * (1 - outP);
    el.style.opacity = op;
    el.style.transform = `translateY(${(1 - p) * dy - outP * 30}px) scale(${1 + outP * 0.06})`;
    el.style.filter = `blur(${(1 - p) * 7 + outP * 9}px)`;
  }

  /* ZIVA letters — cartoon pop-in: grow with a single overshoot */
  els.letters.forEach((sp, i) => {
    const q = seg(t, TL.name + i * 0.11, 0.72);
    const p = easeOutCubic(q);
    const sc = 0.72 + 0.28 * easeOutBack(q);
    sp.style.opacity = p;
    sp.style.transform = `translateY(${(1 - p) * 70}px) scale(${sc})`;
    sp.style.filter = `blur(${(1 - p) * 12}px)`;
    /* shimmer sweep once settled */
    const sh = t > TL.name + 0.9 ? ((t - TL.name - 0.9) * 26) % 260 : 0;
    sp.style.backgroundPosition = `${-260 + sh * 2}% 0`;
  });

  fadeRise(els.turns, t, TL.turns, 0.8, 34, 6);
  const tq = seg(t, TL.turns, 0.8);
  if (tq > 0) els.turns.style.transform += ` scale(${0.9 + 0.1 * easeOutBack(tq)})`;
  /* the golden "1" pops in with a crown (no blur — it carries drop-shadows) */
  const oq = seg(t, TL.turns + 0.18, 0.75);
  const op2 = easeOutCubic(oq);
  els.one.style.opacity = op2;
  els.one.style.transform = `translateY(${(1 - op2) * 42}px) scale(${0.55 + 0.45 * easeOutBack(oq)})`;

  /* card + rows — single soft overshoot on the card scale (~3px), settled
     well before the reading dwell; rows keep their calm stagger */
  const cq = seg(t, TL.card, 0.9);
  const cp = easeOutCubic(cq);
  els.card.style.opacity = cp;
  els.card.style.transform = `translateY(${(1 - cp) * 90}px) scale(${0.965 + 0.035 * easeOutBack(cq)})`;
  els.rows.forEach((row, i) => fadeRise(row, t, TL.rows[i], 0.7, 26, 4));

  fadeRise(els.closing, t, TL.closing, 0.9, 40, 7);
  const zq = seg(t, TL.closing, 0.9);
  if (zq > 0) els.closing.style.transform += ` scale(${0.82 + 0.18 * easeOutBack(zq)})`;
}

/* ---------------- master seek ---------------- */
function seek(t) {
  t = Math.max(0, Math.min(DUR - 1e-4, t));
  renderBG(t);
  renderDOM(t);
  renderFG(t);
}
window.seek = seek;
window.DUR = DUR;

/* ---------------- fit + play ---------------- */
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const st = document.getElementById('stage');
  st.style.transform = `scale(${s})`;
  st.style.left = `${(window.innerWidth - W * s) / 2}px`;
  st.style.position = 'absolute';
}
const RENDER_MODE = new URLSearchParams(location.search).has('render');
if (!RENDER_MODE) {
  fit();
  window.addEventListener('resize', fit);
  const HOLD = 1.6;
  let start = performance.now();
  (function loop(now) {
    const t = ((now - start) / 1000) % (DUR + HOLD);
    seek(Math.min(t, DUR - 1e-4));
    requestAnimationFrame(loop);
  })(start);
} else {
  seek(0);
}
</script>
