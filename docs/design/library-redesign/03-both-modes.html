<!DOCTYPE html>
<!--
  SproutLab · Diet → Library redesign — S3 DOMAIN-TINTED PILLS · LIGHT + DARK (design record)
  ─────────────────────────────────────────────────────────────────────────
  Both themes side by side in one frame. Dark mode is scoped to the right
  phone via data-theme="dark" on its wrapper (all 758 styles.css dark rules
  are plain attribute selectors, so the dark tokens + dark .dt-* overrides
  cascade to that subtree only; the left phone keeps the :root light tokens).

  Domain whisper softened per Architect tuning: the pill stays --card-bg and
  the category accent fades in over the far corner at ~18% (light) / ~16%
  deep-hue (dark) — the §Tint hue-swap law: light uses the pale ACCENT, dark
  the deep --tc hue, never the same in both.
-->
<html lang="en" data-zoom="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../split/styles.css">
<style>
  html, body { background:#cfc6bf; }
  body { margin:0; font-family:'Nunito',sans-serif; padding:24px; }
  .r-stage { display:flex; gap:28px; align-items:flex-start; justify-content:center; }
  .r-col { width:412px; flex:0 0 auto; }
  .r-mode { font-family:'Fraunces',serif; font-weight:600; font-size:18px; text-align:center;
    margin:0 0 10px; letter-spacing:0.04em; }
  .r-mode.light { color:#5a4f48; } .r-mode.dark { color:#2a2230; }
  .r-phone { width:412px; box-sizing:border-box; background:var(--bg, #faf6f3); color:var(--text);
    border-radius:22px; padding:var(--sp-16); box-shadow:0 6px 30px rgba(0,0,0,0.14); }
  .r-phone[data-theme="dark"] { background:#1a1620; box-shadow:0 6px 30px rgba(0,0,0,0.5); }
  .r-cap { font-size:var(--fs-2xs); color:var(--light); font-style:italic;
    margin:var(--sp-12) 0 0; padding-left:var(--sp-4); border-left:2px solid var(--card-border); line-height:1.5; }
  .r-h { font-family:'Fraunces',serif; font-size:var(--fs-xl); font-weight:600; color:var(--text); margin:0 0 var(--sp-12); }

  .emerg-entry { display:flex; align-items:center; gap:var(--sp-12); width:100%; text-align:left;
    background:var(--rose-light); border-left:var(--accent-w, 3px) solid var(--rose); border-radius:var(--r-2xl);
    padding:var(--sp-16); min-height:44px; box-shadow:0 3px 14px var(--shadow); }
  .emerg-entry-icon { flex:0 0 auto; width:40px; height:40px; border-radius:var(--r-full);
    background:var(--rose); color:var(--card-bg); display:flex; align-items:center; justify-content:center; }
  .emerg-entry-icon .zi { width:var(--icon-lg); height:var(--icon-lg); }
  .emerg-entry-txt { flex:1; min-width:0; }
  .emerg-entry-title { font-family:'Fraunces',serif; font-weight:600; font-size:var(--fs-lg); color:var(--tc-rose); line-height:var(--lh-snug); }
  .emerg-entry-sub { font-size:var(--fs-xs); color:var(--mid); margin-top:var(--sp-2); }
  .emerg-entry-go { flex:0 0 auto; color:var(--tc-rose); }
  .emerg-entry-go .zi { width:var(--icon-md); height:var(--icon-md); }

  .lib-group { margin-bottom:var(--sp-16); }
  .lib-group-label { display:flex; align-items:center; gap:var(--sp-8); font-family:'Fraunces',serif;
    font-weight:600; font-size:var(--fs-md); line-height:var(--lh-snug); margin:var(--sp-12) 0 var(--sp-10); padding-left:var(--sp-4); }
  .lib-group-label .zi { width:var(--icon-md); height:var(--icon-md); flex:0 0 auto; }
  .lib-group-count { margin-left:auto; font-family:'Nunito',sans-serif; font-weight:700; font-size:var(--fs-2xs); opacity:0.7; }
  .lib-group--encourage   .lib-group-label { color:var(--tc-sage); }
  .lib-group--conditional .lib-group-label { color:var(--tc-amber); }
  .lib-group--warn        .lib-group-label { color:var(--tc-rose); }
  .lib-group--inform      .lib-group-label { color:var(--tc-sky); }
  .lib-shelf-row { display:flex; flex-direction:column; gap:var(--sp-10); }

  .lib-book { display:flex; align-items:center; gap:var(--sp-12); width:100%; text-align:left;
    border-radius:var(--r-lg); padding:var(--sp-12) var(--sp-16); min-height:44px;
    box-shadow:0 1px 8px var(--shadow); border-left:var(--accent-w, 3px) solid var(--mid); background-color:var(--card-bg); }
  .lib-book--encourage   { border-left-color:var(--sage); }
  .lib-book--conditional { border-left-color:var(--amber); }
  .lib-book--warn        { border-left-color:var(--rose); }
  .lib-book--inform      { border-left-color:var(--sky); }

  /* LIGHT — pale ACCENT whisper (~22%) over the far corner */
  .dt-grains { background-image:linear-gradient(135deg, transparent 40%, rgba(181,213,197,0.22)); }
  .dt-nonveg { background-image:linear-gradient(135deg, transparent 40%, rgba(242,168,184,0.22)); }
  .dt-nuts   { background-image:linear-gradient(135deg, transparent 40%, rgba(201,184,232,0.22)); }
  .dt-dairy  { background-image:linear-gradient(135deg, transparent 40%, rgba(168,207,224,0.22)); }
  .dt-fruits { background-image:linear-gradient(135deg, transparent 40%, rgba(242,168,184,0.22)); }
  .dt-spices { background-image:linear-gradient(135deg, transparent 40%, rgba(232,184,109,0.22)); }
  .dt-vegs   { background-image:linear-gradient(135deg, transparent 40%, rgba(250,212,180,0.22)); }

  /* DARK — hue-swap: deep --tc hue (~16%) over the dark card surface */
  [data-theme="dark"] .dt-grains { background-image:linear-gradient(135deg, transparent 30%, rgba(58,112,96,0.16)); }
  [data-theme="dark"] .dt-nonveg { background-image:linear-gradient(135deg, transparent 30%, rgba(158,62,82,0.18)); }
  [data-theme="dark"] .dt-nuts   { background-image:linear-gradient(135deg, transparent 30%, rgba(110,94,154,0.18)); }
  [data-theme="dark"] .dt-dairy  { background-image:linear-gradient(135deg, transparent 30%, rgba(58,112,144,0.16)); }
  [data-theme="dark"] .dt-fruits { background-image:linear-gradient(135deg, transparent 30%, rgba(158,62,82,0.18)); }
  [data-theme="dark"] .dt-spices { background-image:linear-gradient(135deg, transparent 30%, rgba(138,101,32,0.18)); }
  [data-theme="dark"] .dt-vegs   { background-image:linear-gradient(135deg, transparent 30%, rgba(138,85,32,0.16)); }

  .lib-book-body { flex:1; min-width:0; }
  .lib-book-title { font-family:'Fraunces',serif; font-weight:600; font-size:var(--fs-md); color:var(--text); line-height:var(--lh-snug); }
  .lib-book-glance { font-size:var(--fs-sm); color:var(--mid); margin-top:var(--sp-4); display:flex; align-items:center; gap:var(--sp-6); }
  .lib-book-glance .zi { width:var(--icon-sm); height:var(--icon-sm); flex:0 0 auto; color:var(--tc-amber); }
  .lib-book-siren { flex:0 0 auto; color:var(--rose); display:flex; align-items:center; }
  .lib-book-siren .zi { width:var(--icon-base); height:var(--icon-base); }
  .lib-book-go { flex:0 0 auto; color:var(--light); align-self:center; }
  .lib-book-go .zi { width:var(--icon-base); height:var(--icon-base); }
</style>
</head>
